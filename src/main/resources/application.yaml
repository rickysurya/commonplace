spring:
  application:
    name: commonplace
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commonplace}
    username: ${SPRING_DATASOURCE_USERNAME:dev}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  ai:
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: qwen2.5:3b
      embedding:
        model: mxbai-embed-large        # can switch to nomic-embed-text for high volume but with search accuracy as the trade-off
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024                #768 for nomic-embed-text
        index-type: HNSW                # Hierarchial Navigable Small World for faster similarity search
        distance-type: COSINE_DISTANCE