<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commonplace API</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }
        header a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
        header a:hover { color: var(--accent); }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .msg { display: flex; flex-direction: column; gap: 0.5rem; }
        .msg.user { align-items: flex-end; }
        .msg.bot { align-items: flex-start; }

        .bubble {
            padding: 1rem;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
        }
        .msg.user .bubble { background: var(--accent); color: white; }
        .msg.bot .bubble { background: var(--panel); border: 1px solid var(--border); }

        .sources {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 0.5rem;
            border-top: 1px solid var(--border);
            padding-top: 0.5rem;
        }
        .sources span { color: var(--accent); }

        footer {
            padding: 1rem 2rem 2rem 2rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .input-group {
            display: flex;
            gap: 1rem;
            background: var(--panel);
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 0.5rem;
            font-size: 1rem;
            outline: none;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { font-style: italic; color: var(--muted); }
    </style>
</head>
<body>

<header>
    <h1>COMMONPLACE</h1>
    <div>
        <a href="/swagger-ui.html" target="_blank">Swagger UI</a> |
        <a href="https://github.com/rickysurya/commonplace" target="_blank">GitHub</a>
    </div>
</header>

<div id="chat">
    <div class="msg bot">
        <div class="bubble">
            Welcome to Commonplace. I am a RAG-powered assistant running on local models. Ask me anything about the documents in my database.
        </div>
    </div>
</div>

<footer>
    <div class="input-group">
        <input type="text" id="q" placeholder="Ask a question (e.g., why do octopuses prefer crawling?)..." autocomplete="off">
        <button id="send" onclick="ask()">Send</button>
    </div>
</footer>

<script>
    async function ask() {
        const q = document.getElementById('q').value.trim();
        if (!q) return;

        const chat = document.getElementById('chat');
        const btn = document.getElementById('send');
        const input = document.getElementById('q');

        // Add user message
        chat.innerHTML += `
                <div class="msg user">
                    <div class="bubble">${escapeHtml(q)}</div>
                </div>
            `;
        input.value = '';
        input.disabled = true;
        btn.disabled = true;
        chat.scrollTop = chat.scrollHeight;

        // Add loading message
        const loadingId = 'loading-' + Date.now();
        chat.innerHTML += `
                <div class="msg bot" id="${loadingId}">
                    <div class="bubble loading">Retrieving context and generating answer...</div>
                </div>
            `;
        chat.scrollTop = chat.scrollHeight;

        try {
            const res = await fetch(`/api/ask?q=${encodeURIComponent(q)}`);
            if (!res.ok) throw new Error('Server error');

            const data = await res.json();

            // Remove loading
            document.getElementById(loadingId).remove();

            // Format sources
            let sourcesHtml = '';
            if (data.sources && data.sources.length > 0) {
                sourcesHtml = `<div class="sources"><strong>Sources:</strong><br>` +
                    data.sources.map(s => `<span>[${s.source || 'unknown'}]</span> ${escapeHtml(s.text.substring(0, 100))}...`).join('<br>') +
                    `</div>`;
            }

            // Add bot message
            chat.innerHTML += `
                    <div class="msg bot">
                        <div class="bubble">
                            ${escapeHtml(data.answer).replace(/\n/g, '<br>')}
                            ${sourcesHtml}
                        </div>
                    </div>
                `;
        } catch (err) {
            document.getElementById(loadingId).remove();
            chat.innerHTML += `
                    <div class="msg bot">
                        <div class="bubble" style="border-color: red; color: #f87171;">
                            Error: ${err.message}. Is the backend running?
                        </div>
                    </div>
                `;
        } finally {
            input.disabled = false;
            btn.disabled = false;
            input.focus();
            chat.scrollTop = chat.scrollHeight;
        }
    }

    function escapeHtml(unsafe) {
        return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    document.getElementById('q').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') ask();
    });
</script>
</body>
</html>
